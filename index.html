<script>
// Android bierze kolor dolnego paska z manifestu, więc wybieramy manifest w kolorze stylu (przed instalacją i przy każdym starcie)
(function () {
  var f = "manifest.webmanifest";
  try {
    var skin = (JSON.parse(localStorage.getItem("trening-look") || "{}").skin) || "calm";
    if (skin === "pomost") f = "manifest-pomost.webmanifest";
    else if (skin === "notes") f = "manifest-notes.webmanifest";
    else if (matchMedia("(prefers-color-scheme: dark)").matches) f = "manifest-dark.webmanifest";
  } catch (e) {}
  var l = document.createElement("link"); l.rel = "manifest"; l.href = f; document.head.appendChild(l);
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: jedna kolumna jak aplikacja na telefonie — przyklejony pasek bloku/tygodnia u góry,
   pasek zakładek na dole, arkusze wysuwane od dołu do zapisu i edycji. */
:root {
  --bg: #eef1f5;          /* kreda / jasna guma */
  --surface: #ffffff;
  --surface-2: #f6f8fb;
  --ink: #10141b;
  --ink-2: #465063;
  --muted: #7a8394;
  --line: #d9dee6;
  --accent: #1d4ed8;      /* niebieski talerz 20 kg */
  --accent-ink: #ffffff;
  --accent-soft: #e2e9fc;
  --good: #1b7f47;
  --good-soft: #def3e7;
  --warn: #9a5b00;
  --warn-soft: #fbecd2;
  --bad: #b8322a;
  --bad-soft: #f9e0de;
  --shadow: 0 10px 30px rgba(16, 20, 27, .14);
  --plate-25: #c62828; --plate-20: #1d4ed8; --plate-15: #e2b007; --plate-10: #2e8b3e; --plate-5: #f4f4f4; --plate-2: #222; --plate-1: #a9b0bb;
  /* Kolory dni: przygaszone odcienie, tło dnia i nazwy ćwiczeń */
  --d1: #3d64c9; --d1-ink: #27449a;
  --d2: #2f8a68; --d2-ink: #1d6047;
  --d3: #b07a1c; --d3-ink: #7a5310;
  --d4: #7b55b3; --d4-ink: #563788;
  --d5: #2c8590; --d5-ink: #1b5d66;
  --d6: #b25a4f; --d6-ink: #84392f;
  --d7: #5c6880; --d7-ink: #3d475b;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 0.875rem; --r-md: 0.75rem; --r-sm: 0.625rem; --r-pill: 62.4375rem; --r-sheet: 1.25rem;
  --font-num: var(--font-display);
  --tabbar: 4rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1116; --surface: #161a21; --surface-2: #1c212a; --ink: #e9edf3; --ink-2: #b2bac7; --muted: #7f8897;
    --line: #272d37; --accent: #7e9dff; --accent-ink: #0a0f1f; --accent-soft: #1b2442;
    --good: #57c98b; --good-soft: #15301f; --warn: #eaa94a; --warn-soft: #34260f; --bad: #f2756a; --bad-soft: #3a1714;
    --shadow: 0 10px 30px rgba(0, 0, 0, .5); --plate-5: #dcdcdc; --plate-2: #555;
    --d1: #6f8fe6; --d1-ink: #aebffa; --d2: #4fb48e; --d2-ink: #9adbbf; --d3: #d3a04a; --d3-ink: #ecc98a;
    --d4: #a07fd6; --d4-ink: #d0bbf1; --d5: #4fb0ba; --d5-ink: #9bd9df; --d6: #d9877c; --d6-ink: #f2b6ae;
    --d7: #8994ab; --d7-ink: #c3cad8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1116; --surface: #161a21; --surface-2: #1c212a; --ink: #e9edf3; --ink-2: #b2bac7; --muted: #7f8897;
  --line: #272d37; --accent: #7e9dff; --accent-ink: #0a0f1f; --accent-soft: #1b2442;
  --good: #57c98b; --good-soft: #15301f; --warn: #eaa94a; --warn-soft: #34260f; --bad: #f2756a; --bad-soft: #3a1714;
  --shadow: 0 10px 30px rgba(0, 0, 0, .5); --plate-5: #dcdcdc; --plate-2: #555;
    --d1: #6f8fe6; --d1-ink: #aebffa; --d2: #4fb48e; --d2-ink: #9adbbf; --d3: #d3a04a; --d3-ink: #ecc98a;
    --d4: #a07fd6; --d4-ink: #d0bbf1; --d5: #4fb0ba; --d5-ink: #9bd9df; --d6: #d9877c; --d6-ink: #f2b6ae;
    --d7: #8994ab; --d7-ink: #c3cad8;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: .01em; }

.app {
  max-width: 35rem; margin: 0 auto; min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(var(--tabbar) + 1.75rem + env(safe-area-inset-bottom, 0px));
}

/* ---------- Pasek górny ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg);
  padding-block: 0.75rem 0.625rem; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); display: grid; gap: 0.625rem;
}
.top-row { display: flex; align-items: center; gap: 0.625rem; min-width: 0; }
.titles { display: grid; gap: 2px; min-width: 0; justify-items: start; }
.plan-btn {
  background: none; border: 0; padding: 0; font-size: 0.8125rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  color: var(--accent); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left;
}
.plan-btn .caret { color: var(--muted); }
.block-btn {
  display: flex; align-items: baseline; gap: 0.5rem; background: none; border: 0; padding: 0; min-width: 0;
  font-family: var(--font-display); font-weight: 700; font-size: 1.875rem; line-height: 1; letter-spacing: .01em; text-transform: uppercase;
}
.block-btn .caret { font-size: 1rem; color: var(--muted); }
.top-meta { margin-left: auto; color: var(--muted); font-size: 0.8125rem; text-align: right; white-space: nowrap; }
.weeks { display: flex; gap: 0.375rem; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.weeks::-webkit-scrollbar { display: none; }
.chip {
  flex: none; min-width: 3rem; height: 2.375rem; padding: 0 0.75rem; border-radius: var(--r-pill); border: 1px solid var(--line);
  background: var(--surface); font-family: var(--font-display); font-weight: 600; font-size: 1.125rem; letter-spacing: .03em;
  display: inline-flex; align-items: center; justify-content: center; gap: 0.375rem;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .dot { width: 0.375rem; height: 0.375rem; border-radius: 50%; background: var(--good); }
.chip.ghost { border-style: dashed; color: var(--ink-2); background: transparent; }

/* ---------- Dni i wpisy ---------- */
.stack { display: grid; gap: 0.875rem; padding-top: 0.875rem; }
.day, .nw-day { --day: var(--d1); --day-ink: var(--d1-ink); }
.d2 { --day: var(--d2); --day-ink: var(--d2-ink); } .d3 { --day: var(--d3); --day-ink: var(--d3-ink); }
.d4 { --day: var(--d4); --day-ink: var(--d4-ink); } .d5 { --day: var(--d5); --day-ink: var(--d5-ink); }
.d6 { --day: var(--d6); --day-ink: var(--d6-ink); } .d7 { --day: var(--d7); --day-ink: var(--d7-ink); }
.day {
  background: color-mix(in srgb, var(--day) 4%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--day) 30%, var(--line)); border-radius: var(--r); overflow: hidden;
}
.day-head {
  display: flex; align-items: center; gap: 0.625rem; padding: 0.75rem 0.875rem 0.625rem;
  background: color-mix(in srgb, var(--day) 15%, var(--surface));
  border-bottom: 1px solid color-mix(in srgb, var(--day) 30%, var(--line));
}
.day-title { font-family: var(--font-display); font-weight: 700; font-size: 1.3125rem; text-transform: uppercase; letter-spacing: .02em; color: var(--day-ink); }
.day-head .day-date, .day-head .day-count { color: color-mix(in srgb, var(--day-ink) 70%, var(--muted)); }
.day-date { color: var(--muted); font-size: 0.875rem; }
.day-count { margin-left: auto; font-size: 0.8125rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.icon-btn { width: 2.25rem; height: 2.25rem; border-radius: var(--r-sm); border: 0; background: transparent; color: var(--ink-2); font-size: 1.25rem; line-height: 1; display: inline-grid; place-items: center; }
.icon-btn:hover { background: var(--surface-2); }
.exg { padding: 0.625rem 0.875rem 0.25rem; border-bottom: 1px solid color-mix(in srgb, var(--day) 18%, var(--line)); }
.exg:last-of-type { border-bottom: 0; }
.exg-name { font-weight: 600; font-size: 1rem; margin-bottom: 0.25rem; overflow-wrap: anywhere; color: var(--day-ink); }
.exg-name small { font-weight: 500; color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: .06em; margin-left: 0.375rem; }
.entry {
  width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 0.625rem;
  padding: 0.5625rem 0; border: 0; border-top: 1px dashed color-mix(in srgb, var(--day) 22%, var(--line)); background: none; text-align: left;
}
.exg-name + .entry { border-top: 0; }
.rx { min-width: 0; }
.rx-main { font-family: var(--font-num); font-size: 1.25rem; font-weight: 600; letter-spacing: .02em; }
.rx-sub { font-size: 0.8125rem; color: var(--ink-2); }
.res { text-align: right; display: grid; justify-items: end; gap: 2px; }
.res-kg { font-family: var(--font-num); font-weight: 700; font-size: 1.375rem; font-variant-numeric: tabular-nums; }
.res-kg.sug { color: var(--accent); font-weight: 600; }
.res-kg.none { color: var(--muted); font-size: 0.9375rem; font-family: var(--font-body); font-weight: 500; }
.res-sub { font-size: 0.7812rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.pill { display: inline-flex; align-items: center; gap: 0.25rem; font-size: 0.75rem; font-weight: 600; padding: 2px 0.5rem; border-radius: var(--r-pill); white-space: nowrap; }
.pill.good { color: var(--good); background: var(--good-soft); }
.pill.warn { color: var(--warn); background: var(--warn-soft); }
.pill.bad { color: var(--bad); background: var(--bad-soft); }
.pill.info { color: var(--ink-2); background: var(--surface-2); }
.day-add { display: block; width: 100%; padding: 0.75rem 0.875rem; border: 0; border-top: 1px solid color-mix(in srgb, var(--day) 18%, var(--line)); background: none; color: var(--day-ink); font-weight: 600; text-align: left; }
.note-line { font-size: 0.8125rem; color: var(--ink-2); padding: 0 0 0.5rem; overflow-wrap: anywhere; }

/* ---------- Karty i ekrany ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 0.875rem; }
.h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.625rem; text-transform: uppercase; letter-spacing: .02em; margin: 0.375rem 0 0; }
.label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 0.8125rem; }
.empty { text-align: center; padding: 2.25rem 1.125rem; display: grid; gap: 0.625rem; justify-items: center; }
.empty .big { font-family: var(--font-display); font-size: 1.625rem; font-weight: 700; text-transform: uppercase; }

.hero { display: grid; gap: 0.25rem; }
.hero-num { font-family: var(--font-num); font-weight: 700; font-size: 3.5rem; line-height: 1; font-variant-numeric: tabular-nums; }
.hero-num small { font-size: 1.375rem; color: var(--muted); font-weight: 600; margin-left: 0.25rem; }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.625rem; margin-top: 0.625rem; }
.kpi { background: var(--surface-2); border-radius: var(--r-sm); padding: 0.625rem; }
.kpi .v { font-family: var(--font-num); font-weight: 700; font-size: 1.5rem; font-variant-numeric: tabular-nums; }

.chart-wrap { position: relative; margin-top: 0.75rem; }
.chart-wrap svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart-tip {
  position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: var(--r-sm); padding: 0.5rem 0.625rem;
  font-size: 13px; line-height: 1.35; box-shadow: var(--shadow); max-width: 220px; z-index: 2;
}
.chart-tip b { font-family: var(--font-num); font-size: 1.125rem; }
.legend { display: flex; flex-wrap: wrap; gap: 0.375rem 0.875rem; font-size: 0.7812rem; color: var(--ink-2); margin-top: 0.5rem; }
.legend i { display: inline-block; width: 0.625rem; height: 0.625rem; border-radius: 50%; margin-right: 0.3125rem; vertical-align: -1px; }

.table-wrap { overflow-x: auto; margin-inline: -0.875rem; padding-inline: 0.875rem; }
table { border-collapse: collapse; width: 100%; font-size: 0.875rem; font-variant-numeric: tabular-nums; }
th { text-align: right; font-size: 0.7188rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 0.375rem 0.5rem; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { text-align: right; padding: 0.5rem; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; padding-left: 0; }
td:last-child, th:last-child { padding-right: 0; }

.sess { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.5rem; align-items: center; padding: 0.5625rem 0; border-bottom: 1px solid var(--line); }
.sess:last-child { border-bottom: 0; }

.list-row { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.625rem; align-items: center; padding: 0.6875rem 0; background: none; border: 0; border-bottom: 1px solid var(--line); text-align: left; }
.list-row:last-child { border-bottom: 0; }
.list-row .t { font-weight: 600; overflow-wrap: anywhere; }
.list-row .s { font-size: 0.8125rem; color: var(--ink-2); }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-md); padding: 0.1875rem; gap: 0.1875rem; }
.seg button { border: 0; background: transparent; border-radius: var(--r-sm); padding: 0.5rem 0.25rem; font-weight: 600; font-size: 0.875rem; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

/* ---------- Formularze ---------- */
.field { display: grid; gap: 0.375rem; }
.field > span { font-size: 0.8125rem; font-weight: 600; color: var(--ink-2); }
.input, select.input, textarea.input {
  width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--surface-2); border-radius: var(--r-md); padding: 0.6875rem 0.75rem; font-size: max(16px, 1rem);
}
textarea.input { resize: vertical; min-height: 4rem; }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.625rem; }
.stepper { display: grid; grid-template-columns: 3.5rem minmax(0, 1fr) 3.5rem; gap: 0.5rem; align-items: center; }
.stepper button { height: 3.25rem; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); font-family: var(--font-num); font-size: 1.375rem; font-weight: 700; }
.stepper input { text-align: center; font-family: var(--font-num); font-size: 1.875rem; font-weight: 700; height: 3.25rem; padding: 0 0.375rem; }
.chips { display: flex; flex-wrap: wrap; gap: 0.375rem; }
.chips button {
  min-width: 2.875rem; height: 2.625rem; padding: 0 0.625rem; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface);
  font-family: var(--font-num); font-weight: 600; font-size: 1.1875rem; font-variant-numeric: tabular-nums;
}
.chips button.hint { border-color: var(--accent); border-width: 2px; }
.chips button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn { height: 3.125rem; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); padding: 0 1rem; font-weight: 600; font-size: 1rem; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); border-color: var(--bad-soft); background: var(--bad-soft); }
.btn.link { border: 0; background: none; color: var(--accent); height: auto; padding: 0.375rem 0; }
.btn-row { display: flex; gap: 0.625rem; flex-wrap: wrap; }
.btn-row .btn { flex: 1 1 auto; }
.check { display: flex; gap: 0.625rem; align-items: flex-start; font-size: 0.875rem; }
.check input { width: 1.25rem; height: 1.25rem; margin-top: 1px; accent-color: var(--accent); }

.sugbox { background: var(--accent-soft); border-radius: var(--r-md); padding: 0.75rem; display: grid; gap: 0.375rem; }
.sugbox .k { font-family: var(--font-num); font-weight: 700; font-size: 1.875rem; color: var(--accent); line-height: 1; }
.sugrange { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 0.5rem; font-size: 0.875rem; font-weight: 600; color: var(--ink-2); }
.sugrange .bar { position: relative; height: 0.25rem; border-radius: 1rem; background: linear-gradient(90deg, var(--line), var(--accent)); }
.sugrange .bar i { position: absolute; top: 50%; width: 0.75rem; height: 0.75rem; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); transform: translate(-50%, -50%); }
.sugrange-lab { display: flex; justify-content: space-between; margin-top: -0.25rem; font-size: 0.75rem; }
.workup { border-top: 1px solid var(--line); padding-top: 0.375rem; }
.workup summary { cursor: pointer; font-size: 0.875rem; font-weight: 600; color: var(--accent); list-style-position: inside; }
.wu-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.25rem 0.375rem; margin: 0.5rem 0 0.375rem; }
.wu-target { display: flex; align-items: center; gap: 0.625rem; padding-top: 0.5rem; margin-bottom: 0.375rem; border-top: 1px dashed var(--line); }
.wu { display: inline-flex; align-items: baseline; gap: 0.125rem; padding: 0.1875rem 0.5rem; border-radius: 0.5rem; background: var(--surface); font-size: 0.875rem; color: var(--ink-2); }
.wu b { color: var(--ink); font-size: 0.9375rem; }
.wu.wu-goal { background: var(--accent); color: var(--accent-ink, #fff); }
.wu.wu-goal b { color: inherit; }
.wu-arr { color: var(--muted); }
.plates { display: flex; align-items: center; gap: 0.1875rem; flex-wrap: wrap; font-size: 0.75rem; color: var(--ink-2); }
.plate { display: inline-grid; place-items: center; height: 1.625rem; min-width: 0.875rem; padding: 0 0.1875rem; border-radius: 0.25rem; font-size: 0.6562rem; font-weight: 700; color: #fff; border: 1px solid rgba(0,0,0,.18); }
.plate.p25 { background: var(--plate-25); height: 2.125rem; } .plate.p20 { background: var(--plate-20); height: 2rem; }
.plate.p15 { background: var(--plate-15); color: #222; height: 1.875rem; } .plate.p10 { background: var(--plate-10); height: 1.75rem; }

<script>
/* Zabezpieczenie: gdy coś się wysypie, zamiast białego ekranu pokaż komunikat i pozwól pobrać kopię danych. Działa nawet wtedy, gdy reszta kodu nie wystartuje. */
(function () {
  var shown = false;
  function backup() {
    var raw = null; try { raw = localStorage.getItem("trening-app-v1"); } catch (e) {}
    if (!raw) { alertBox("Nie znalazłem danych na tym urządzeniu."); return; }
    try {
      var d = JSON.parse(raw); var out = JSON.stringify({ app: "trening", v: 1, exported: new Date().toISOString(), settings: d.settings, exercises: d.exercises, plans: d.plans, blocks: d.blocks }, null, 1);
      var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([out], { type: "application/json" })); a.download = "trening-kopia-awaryjna.json"; document.body.appendChild(a); a.click(); a.remove();
    } catch (e) { try { navigator.clipboard.writeText(raw); alertBox("Skopiowałem dane do schowka. Wklej je do notatki i zachowaj."); } catch (e2) {} }
  }
  function alertBox(t) { var p = document.getElementById("crash-msg"); if (p) p.textContent = t; }
  function show(msg) {
    if (shown || !document.body) return; shown = true;
    var d = document.createElement("div");
    d.id = "crash";
    d.setAttribute("role", "alertdialog");
    d.style.cssText = "position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px;font:16px system-ui,sans-serif";
    d.innerHTML = '<div style="background:#fff;color:#10141b;border-radius:14px;max-width:420px;width:100%;padding:20px;display:grid;gap:12px">'
      + '<b style="font-size:18px">Coś poszło nie tak</b>'
      + '<p id="crash-msg" style="margin:0">Twoje dane są bezpieczne w pamięci telefonu. Na wszelki wypadek pobierz kopię, a potem odśwież aplikację. Jeśli błąd wraca, zgłoś go z tym opisem:</p>'
      + '<code style="font-size:12px;background:#f1f3f6;padding:8px;border-radius:8px;word-break:break-word"></code>'
      + '<div style="display:flex;gap:8px;flex-wrap:wrap"><button data-c="b" style="padding:10px 14px;border-radius:10px;border:0;background:#1d4ed8;color:#fff;font:inherit">Pobierz kopię</button>'
      + '<button data-c="r" style="padding:10px 14px;border-radius:10px;border:1px solid #c9ced8;background:#fff;font:inherit">Odśwież</button>'
      + '<button data-c="x" style="padding:10px 14px;border-radius:10px;border:1px solid #c9ced8;background:#fff;font:inherit">Zamknij</button></div></div>';
    d.querySelector("code").textContent = String(msg || "nieznany błąd").slice(0, 300);
    d.addEventListener("click", function (ev) {
      var c = ev.target && ev.target.getAttribute && ev.target.getAttribute("data-c");
      if (c === "b") backup(); else if (c === "r") location.reload(); else if (c === "x") { d.remove(); shown = false; }
    });
    document.body.appendChild(d);
  }
  window.addEventListener("error", function (e) { if (e && e.message) show(e.message + (e.lineno ? " (linia " + e.lineno + ")" : "")); });
  window.addEventListener("unhandledrejection", function (e) { show(e && e.reason && (e.reason.message || e.reason)); });
  window.__showCrash = show;
})();

<script>
/* Silnik obliczeń — czyste funkcje, bez interfejsu.
   Wszystko, co liczy aplikacja (e1RM, sugestie, progresje, podsumowania), jest tutaj,
   żeby dało się to testować osobno i przenieść później do aplikacji na telefon. */
const Engine = (() => {
  // ---------- Tabela RPE (Tuchscherer) ----------
  // Jedna sekwencja: każde pół punktu RPE poniżej 10 albo każde dodatkowe powtórzenie
  // to jeden krok w dół. Zgodna z poprawną tabelą z Twojego arkusza (wiersze 392–408).
  const SEQ = [100, 97.8, 95.5, 93.9, 92.2, 90.7, 89.2, 87.8, 86.3, 85.0, 83.7, 82.4, 81.1, 79.9,
    78.6, 77.4, 76.2, 75.1, 73.9, 72.3, 70.7, 69.4, 68.0, 66.7, 65.3, 64.0, 62.6, 61.3, 59.9, 58.6,
    57.2, 55.8, 54.4, 53.0, 51.6, 50.2, 48.8];
  const seqAt = (i) => (i < SEQ.length ? SEQ[i] : SEQ[SEQ.length - 1] - 1.4 * (i - SEQ.length + 1));

  /** Ułamek 1RM dla danej liczby powtórzeń i RPE (np. 0.863 dla 5 powt. @10). */
  function rpePct(reps, rpe) {
    if (!(reps >= 1) || !(rpe >= 1) || rpe > 10) return null;
    const idx = (reps - 1) * 2 + (10 - rpe) * 2;
    const i0 = Math.floor(idx), f = idx - i0;
    return (seqAt(i0) * (1 - f) + seqAt(i0 + 1) * f) / 100;
  }

  const DEFAULT_SETTINGS = {
    step: 2.5,          // zaokrąglanie ciężaru
    minRpe: 6,          // od jakiego RPE seria liczy się do e1RM
    maxReps: 10,        // do ilu powtórzeń seria liczy się do e1RM
    sessions: 2,        // z ilu ostatnich sesji średnia e1RM
    jump: 0.1,          // próg podejrzanego skoku e1RM (10%)
    overshoot: 1.5,     // o ile RPE może przekroczyć plan, zanim pokażemy ostrzeżenie
    bar: 20,            // gryf do kalkulatora talerzy
    perSet: false,      // zapis każdej serii osobno (opcja dla chętnych)
  };

  // Zaokrąglanie zawsze w dół do kroku (jak QUOTIENT w arkuszu trenera); epsilon chroni przed błędem zmiennoprzecinkowym
  const roundTo = (x, step) => (x == null || !isFinite(x) ? null : Math.floor(x / step + 1e-9) * step);
  // Training max (TM): baza z planu, a gdy jej brak - maks zapisany przy ćwiczeniu
  function baseTm(state, planId, exId) {
    const plan = ((state && state.plans) || []).find((p) => p.id === planId);
    const v = plan && plan.bases ? num(plan.bases[exId]) : null;
    if (v && v > 0) return v;
    const ex = ((state && state.exercises) || {})[exId];
    const m = ex ? num(ex.max) : null;
    return m && m > 0 ? m : null;
  }
  const num = (v) => (typeof v === "number" && isFinite(v) ? v : null);

  // ---------- Parsowanie zapisu serii i powtórzeń ----------
  /** "5" | "8-12" | "8,6,3" | "6>4>3" | "MAX" | "10-20s" -> opis */
  function parseReps(str) {
    const s = String(str ?? "").trim();
    if (!s) return { kind: "none" };
    if (/^\d+$/.test(s)) { const n = +s; return { kind: "fixed", min: n, max: n }; }
    let m = s.match(/^(\d+)\s*[-–]\s*(\d+)$/);
    if (m) return { kind: "range", min: +m[1], max: +m[2] };
    if (/^\d+(\s*[,>.]\s*\d+)+$/.test(s)) {
      const list = s.split(/[,>.]/).map((x) => +x.trim());
      return { kind: "list", list, min: Math.min(...list), max: Math.max(...list), last: list[list.length - 1] };
    }
    if (/^(max|amrap)/i.test(s)) return { kind: "amrap" };
    if (/(s|sek|sekund|sec)\b/i.test(s)) return { kind: "time", text: s };
    return { kind: "text", text: s };
  }
  /** "3" | "2-3" -> {min,max} */
  function parseSets(str) {
    const s = String(str ?? "").trim();
    if (/^\d+$/.test(s)) return { min: +s, max: +s };
    const m = s.match(/^(\d+)\s*[-–]\s*(\d+)$/);
    if (m) return { min: +m[1], max: +m[2] };
    return { min: null, max: null };
  }
  /** "8-9" | "8" | 8 -> {min,max} */
  function parseRpe(v) {
    if (typeof v === "number") return { min: v, max: v };
    const s = String(v ?? "").trim().replace(",", ".");
    if (/^\d+(\.\d+)?$/.test(s)) return { min: +s, max: +s };
    const m = s.match(/^(\d+(?:\.\d+)?)\s*[-–]\s*(\d+(?:\.\d+)?)$/);
    if (m) return { min: +m[1], max: +m[2] };
    return null;
  }
  /** Liczba powtórzeń, dla której liczymy sugestię ciężaru. */
  function targetReps(entry) {
    const r = parseReps(entry.reps);
    if (r.kind === "fixed" || r.kind === "range") return r.min;
    return null;
  }

  // ---------- e1RM z pojedynczego wpisu ----------
  /** e1RM z wpisu (ciężar ostatniej serii, powtórzenia, RPE). null gdy się nie da. */
  function entryE1rm(entry, settings = DEFAULT_SETTINGS) {
    const log = entry && entry.log;
    if (!log) return null;
    // jedna seria -> e1RM (reps z planu, gdy w zapisie ich brak)
    const one = (kgV, repsV, rpeV, fromPlan) => {
      const kg = num(kgV), rpe = num(rpeV);
      if (!(kg > 0) || rpe == null || rpe < 4) return null;
      let reps = num(repsV);
      if (reps == null && fromPlan) {
        const r = parseReps(entry.reps);
        if (r.kind === "fixed") reps = r.min;
        else if (r.kind === "list" && !log.kgText) reps = r.last;
      }
      if (!(reps >= 1) || reps > 12) return null;
      const pct = rpePct(reps, rpe);
      if (!pct) return null;
      return { value: kg / pct, reps, rpe, kg, reliable: rpe >= settings.minRpe && reps <= settings.maxReps };
    };
    // ostatnia seria (pola główne) + opcjonalnie wcześniejsze serie (log.sets); bierzemy najlepszą wiarygodną
    const cands = [one(log.kg, log.reps, log.rpe, true)];
    if (Array.isArray(log.sets)) for (const st of log.sets) cands.push(one(st.kg, st.reps, st.rpe, false));
    let best = null;
    for (const c of cands) if (c && (!best || (c.reliable && !best.reliable) || (c.reliable === best.reliable && c.value > best.value))) best = c;
    return best;
  }

  // ---------- Iteracja po planie ----------
  function walk(state) {
    const out = [];
    for (const b of state.blocks || []) {
      (b.weeks || []).forEach((w, wi) => {
        (w.days || []).forEach((d, di) => {
          (d.entries || []).forEach((e, ei) => out.push({ b, w, wi, d, di, e, ei }));
        });
      });
    }
    return out;
  }

  const dayKey = (b, wi, di) => `${b.id}/${wi}/${di}`;
  const entryDate = (d, e) => (e.log && e.log.at) || d.date || null;

  // ---------- Sesje i bieżący e1RM ----------
  /**
   * Analiza historii jednego ćwiczenia: sesje chronologicznie, z bieżącym e1RM
   * po każdej sesji i oznaczeniem podejrzanych skoków.
   */
  function analyze(state, exId, opts = {}) {
    const settings = { ...DEFAULT_SETTINGS, ...(state.settings || {}), ...(opts.settings || {}) };
    const map = new Map();
    const exDef = (state.exercises || {})[exId];
    if (exDef && exDef.bw) return { sessions: [], current: null, best: null, settings };
    for (const { b, wi, d, di, e, ei } of walk(state)) {
      if (e.exId !== exId) continue;
      const r = entryE1rm(e, settings);
      if (!r) continue;
      const key = dayKey(b, wi, di);
      if (opts.excludeKey && key === opts.excludeKey) continue;
      const date = entryDate(d, e);
      if (opts.before && date && date >= opts.before) continue;
      if (!map.has(key)) map.set(key, { key, blockId: b.id, blockName: b.name, wi, di, dayName: d.name, date, sets: [] });
      map.get(key).sets.push({ ...r, ei, entryId: e.id, confirmed: !!e.ok, skip: !!e.skip });
    }
    const sessions = [...map.values()].sort((a, b) => (a.date || "").localeCompare(b.date || "") || a.key.localeCompare(b.key));
    const used = [];    // wiarygodne sesje wliczone do bieżącego e1RM
    const usedLow = []; // sesje z niskim RPE — tylko gdy nie ma wiarygodnych
    let pending = [];   // podejrzane skoki czekające na potwierdzenie
    for (const s of sessions) {
      // wyniki oznaczone "nie licz do e1RM" (np. słaby dzień) widać w historii, ale nie wchodzą do bieżącego e1RM
      const live = s.sets.filter((x) => !x.skip);
      s.skipped = !live.length;
      const rel = (live.length ? live : s.sets).filter((x) => x.reliable);
      const pool = rel.length ? rel : live.length ? live : s.sets;
      const top = pool.reduce((a, x) => (x.value > a.value ? x : a), pool[0]);
      s.value = top.value; s.top = top; s.reliable = rel.length > 0;
      const prev = currentFrom(used, usedLow, settings);
      s.before = prev;
      const ref = prev && !prev.low ? prev.value : null;
      s.change = prev ? s.value / prev.value - 1 : null;
      s.flagged = false;
      if (s.skipped) { s.after = prev; continue; }
      if (!s.reliable) { usedLow.push(s); s.after = currentFrom(used, usedLow, settings); continue; }
      const jump = ref != null && s.value / ref - 1 > settings.jump;
      if (jump && !top.confirmed && !pending.length) {
        s.flagged = true; pending.push(s);          // pojedynczy skok: wstrzymany
      } else {
        if (jump && pending.length) {                // kolejna sesja też wysoko: skok był prawdziwy
          for (const p of pending) { p.flagged = false; p.corroborated = true; used.push(p); }
        }
        pending = [];
        used.push(s);
      }
      s.after = currentFrom(used, usedLow, settings);
    }
    const current = currentFrom(used, usedLow, settings);
    const best = sessions.reduce((a, s) => (s.reliable && !s.flagged && !s.skipped && (!a || s.value > a.value) ? s : a), null);
    return { sessions, current, best, settings };
  }

  function currentFrom(used, usedLow, settings) {
    const pool = used.length ? used : usedLow;
    if (!pool.length) return null;
    const last = pool.slice(-settings.sessions);
    const value = last.reduce((a, s) => a + s.value, 0) / last.length;
    return { value, from: last.map((s) => s.key), low: !used.length, lastDate: last[last.length - 1].date };
  }

  /** Bieżący e1RM ćwiczenia z sesji przed podaną datą (lub ze wszystkich). */
  function currentE1rm(state, exId, before, excludeKey) {
    const cur = analyze(state, exId, { before, excludeKey }).current;
    // Ręczny e1RM ćwiczenia (np. po przerwie) obowiązuje, dopóki nie ma nowszych wyników.
    const ex = (state.exercises || {})[exId];
    const m = ex && ex.e1rmManual;
    const mv = m ? num(m.value) : null;
    // "after" = data ostatniego zapisanego wyniku w chwili wpisania ręcznego e1RM (daty w planie bywają wcześniejsze niż dzień zapisu,
    // więc porównujemy z nią, a nie z dniem wpisania). Stare wpisy bez "after" porównują się z datą wpisania.
    const newer = cur && cur.lastDate && (m && m.after ? cur.lastDate > m.after : m && m.date && cur.lastDate >= m.date);
    if (mv && mv > 0 && !newer) {
      return { value: mv, from: [], low: false, lastDate: m.date || null, manual: true };
    }
    return cur;
  }

  // ---------- Sugestia ciężaru ----------
  /**
   * Sugerowany ciężar dla wpisu w planie.
   * Zwraca {kg, lo, hi, basis, src, note} albo null.
   * Wpis z zapisanym wynikiem ma sugestię zamrożoną (e.sug).
   */
  function suggest(state, ctx) {
    const { b, wi, d, di, e } = ctx;
    const settings = { ...DEFAULT_SETTINGS, ...(state.settings || {}) };
    const ex = (state.exercises || {})[e.exId] || {};
    if (e.log && e.sug != null) return { kg: e.sug, basis: e.basis ?? null, src: "frozen" };
    const step = settings.step;
    const reps = targetReps(e);
    const val = num(e.value);
    // Ciężar wpisany ręcznie przy tym wpisie (zamiast liczonego z planu)
    if (e.kgMode === "manual") return num(e.kgPlan) != null ? { kg: num(e.kgPlan), src: "manual" } : null;
    if (e.type === "kg") {
      if (val == null) return null;
      return { kg: val, src: "kg" };
    }
    if (e.type === "pct_top") {
      // X% mniej niż top set tego samego ćwiczenia, który stoi wcześniej w dniu
      if (val == null) return null;
      const list = (d && d.entries) || [];
      let i = list.findIndex((x) => x.id === e.id);
      if (i < 0) i = list.length;
      let top = null;
      for (let k = i - 1; k >= 0; k--) { if (list[k].exId === e.exId && list[k].type !== "pct_top") { top = list[k]; break; } }
      if (!top) return { kg: null, src: "pct_top", note: "brak top seta" };
      const tk = top.log && num(top.log.kg) != null ? num(top.log.kg) : (suggest(state, { b, wi, d, di, e: top }) || {}).kg;
      if (tk == null) return { kg: null, src: "pct_top", note: "brak ciężaru top seta" };
      return { kg: roundTo(tk * (1 - val / 100), step), basis: tk, src: "pct_top" };
    }
    const cur = currentE1rm(state, (e.type === "pct_e1rm" && e.refEx) || e.exId, d && d.date, b ? dayKey(b, wi, di) : null);
    if (e.type === "rpe") {
      if (!cur || !reps || val == null) return cur ? null : { kg: null, src: "rpe", note: "brak e1RM" };
      const p = rpePct(reps, val);
      // widełki na gorszy i lepszy dzień: ±1 RPE (ok. ±4–5%), nie ±0,5 — dzienne wahania siły są większe niż dokładność skali RPE
      const pLo = rpePct(reps, Math.max(1, val - 1));
      const pHi = rpePct(reps, Math.min(10, val + 1));
      return { kg: roundTo(cur.value * p, step), lo: roundTo(cur.value * pLo, step), hi: roundTo(cur.value * pHi, step), basis: cur.value, low: cur.low, manual: !!cur.manual, src: "rpe" };
    }
    if (e.type === "pct_e1rm") {
      if (!cur || val == null) return { kg: null, src: "pct_e1rm", note: "brak e1RM" };
      return { kg: roundTo(cur.value * val / 100, step), basis: cur.value, low: cur.low, manual: !!cur.manual, src: "pct_e1rm" };
    }
    if (e.type === "pct_max") {
      const mx = baseTm(state, b && b.planId, e.refEx || e.exId);
      if (!mx || val == null) return { kg: null, src: "pct_max", note: "brak TM" };
      return { kg: roundTo(mx * val / 100, step), basis: mx, src: "pct_max", refEx: e.refEx || null };
    }
    return null;
  }

  // ---------- Ocena wykonanego wpisu ----------
  function evaluate(state, e) {
    const settings = { ...DEFAULT_SETTINGS, ...(state.settings || {}) };
    if (!e.log) return null;
    const out = {};
    const rpe = num(e.log.rpe);
    const target = e.type === "rpe" ? parseRpe(e.value) : parseRpe(e.rpe);
    if (rpe != null && target) {
      if (rpe >= target.max + settings.overshoot) out.over = rpe - target.max;
      else if (rpe <= target.min - settings.overshoot) out.under = target.min - rpe;
    }
    return out;
  }

  // ---------- Progresja: następny tydzień ----------
  const PROG_LABEL = {
    rpe_step: "RPE + co tydzień",
    pct_step: "% + co tydzień",
    linear: "liniowa + kg",
    double: "double progression",
    none: "bez zmian",
  };
  /** Które metody pasują do typu intensywności. */
  function progOptions(type) {
    if (type === "rpe") return ["rpe_step", "none"];
    if (type === "pct_top") return ["none"];
    if (type === "pct_e1rm" || type === "pct_max") return ["pct_step", "none"];
    return ["double", "linear", "none"];
  }

  /** Wpis na kolejny tydzień na podstawie planu i wyniku z tego tygodnia. */
  function progressEntry(e, settings = DEFAULT_SETTINGS) {
    const next = {
      id: uid(), exId: e.exId, sets: e.sets, reps: e.reps, type: e.type,
      value: e.value, rpe: e.rpe, prog: e.prog ? { ...e.prog } : { m: "none", step: 0 },
      note: e.note || null, log: null,
    };
    if (e.refEx) next.refEx = e.refEx;
    if (e.kgMode === "manual") { next.kgMode = "manual"; next.kgPlan = null; }
    const p = next.prog, step = num(p.step) || 0;
    const val = num(e.value);
    const log = e.log || null;
    const why = [];
    if (p.m === "rpe_step" && e.type === "rpe" && val != null) {
      next.value = Math.min(10, +(val + step).toFixed(2));
      why.push(`RPE ${fmt(val)} → ${fmt(next.value)}`);
    } else if (p.m === "pct_step" && (e.type === "pct_e1rm" || e.type === "pct_max") && val != null) {
      next.value = +(val + step).toFixed(2);
      why.push(`${fmt(val)}% → ${fmt(next.value)}%`);
    } else if ((p.m === "linear" || p.m === "double") && e.type === "kg") {
      const prevKg = log && num(log.kg) != null ? num(log.kg) : val;
      const r = parseReps(e.reps);
      const tgtRpe = parseRpe(e.rpe);
      const done = log ? num(log.reps) ?? (r.kind === "fixed" ? r.min : null) : null;
      const rpeOk = !tgtRpe || !log || num(log.rpe) == null || num(log.rpe) <= tgtRpe.max;
      let up = false;
      if (log && prevKg != null) {
        if (p.m === "double") {
          if (r.kind === "range" || r.kind === "fixed") {
            if (done == null) why.push("brak powtórzeń ostatniej serii — ciężar bez zmian");
            else up = done >= r.max && rpeOk;
          }
        } else {
          up = (done == null || done >= (r.min || 0)) && rpeOk;
        }
      }
      next.value = prevKg == null ? null : up ? +(prevKg + step).toFixed(2) : prevKg;
      if (prevKg != null) why.push(up ? `+${fmt(step)} kg (${fmt(prevKg)} → ${fmt(next.value)})` : `zostaje ${fmt(prevKg)} kg`);
    }
    return { entry: next, why: why.join(", ") };
  }

  function addDays(iso, n) {
    if (!iso) return null;
    const dt = new Date(iso + "T12:00:00Z");
    dt.setUTCDate(dt.getUTCDate() + n);
    return dt.toISOString().slice(0, 10);
  }

  /** Nowy tydzień zbudowany z ostatniego tygodnia bloku. */
  function nextWeek(block, settings = DEFAULT_SETTINGS) {
    const last = block.weeks[block.weeks.length - 1];
    if (!last) return { days: [] };
    return {
      days: last.days.map((d) => ({
        id: uid(), name: d.name, date: addDays(d.date, 7),
        entries: d.entries.map((e) => progressEntry(e, settings).entry),
      })),
    };
  }

  /** Kopia tygodnia jako start nowego bloku (bez wyników). */
  function copyWeek(week, startDate) {
    const first = week.days.find((d) => d.date)?.date;
    const shift = first && startDate ? Math.round((Date.parse(startDate) - Date.parse(first)) / 864e5) : 0;
    return {
      days: week.days.map((d) => ({
        id: uid(), name: d.name, date: d.date ? addDays(d.date, shift) : startDate || null,
        entries: d.entries.map((e) => ({
          id: uid(), exId: e.exId, sets: e.sets, reps: e.reps, type: e.type, value: e.value,
          rpe: e.rpe, prog: e.prog ? { ...e.prog } : { m: "none", step: 0 }, note: e.note || null, log: null,
          ...(e.refEx ? { refEx: e.refEx } : {}),
          ...(e.kgMode === "manual" ? { kgMode: "manual", kgPlan: null } : {}),
        })),
      })),
    };
  }

  // ---------- Podsumowania ----------
  /** Tygodniowe sumy dla rodziny bojów (squat/bench/deadlift/other). */
  function weeklyByFamily(state, family, planId) {
    const settings = { ...DEFAULT_SETTINGS, ...(state.settings || {}) };
    const rows = [];
    for (const b of state.blocks || []) {
      if (planId && b.planId !== planId) continue;
      b.weeks.forEach((w, wi) => {
        let sets = 0, reps = 0, volume = 0, top = null, logged = 0, start = null;
        w.days.forEach((d) => {
          if (d.date && (!start || d.date < start)) start = d.date;
          d.entries.forEach((e) => {
            const ex = (state.exercises || {})[e.exId];
            if (!ex || ex.family !== family || !e.log || num(e.log.kg) == null) return;
            logged++;
            const s = parseSets(e.sets).min || 0;
            const r = parseReps(e.reps);
            const rr = r.kind === "fixed" ? r.min : num(e.log.reps) ?? (r.kind === "range" ? r.min : r.kind === "list" ? r.list.reduce((a, x) => a + x, 0) / r.list.length : 0);
            sets += s; reps += s * rr; volume += s * rr * e.log.kg;
            const x = entryE1rm(e, settings);
            if (x && x.reliable && (!top || x.value > top)) top = x.value;
          });
        });
        if (logged) rows.push({ blockId: b.id, blockName: b.name, wi, start, sets, reps, volume, top });
      });
    }
    return rows;
  }

  /** Talerze na stronę dla danego ciężaru. */
  function plates(kg, bar = 20) {
    const set = [25, 20, 15, 10, 5, 2.5, 1.25];
    let side = (kg - bar) / 2;
    if (!(side > 0)) return [];
    const out = [];
    for (const p of set) { while (side >= p - 1e-9) { out.push(p); side -= p; } }
    return side > 0.01 ? null : out;
  }

  function fmt(x, d = 1) {
    if (x == null || !isFinite(x)) return "–";
    const r = Math.round(x * 10 ** d) / 10 ** d;
    return String(r).replace(".", ",");
  }

  let _n = 0;
  function uid() { return Date.now().toString(36) + (_n++).toString(36) + Math.random().toString(36).slice(2, 6); }

  /** Uzupełnia brakujące id i pola (np. po imporcie). Mutuje i zwraca stan. */
  function normalize(state) {
    state.settings = { ...DEFAULT_SETTINGS, ...(state.settings || {}) };
    state.exercises = state.exercises || {};
    state.blocks = state.blocks || [];
    // Treningi (plany): starsze dane bez planu trafiają do pierwszego planu.
    if (!Array.isArray(state.plans) || !state.plans.length) {
      state.plans = state.blocks.length ? [{ id: "p1", name: "Plan od trenera" }] : [];
    }
    for (const b of state.blocks) {
      if (!b.planId || !state.plans.some((p) => p.id === b.planId)) b.planId = state.plans[0] ? state.plans[0].id : null;
      b.id = b.id || uid();
      b.weeks = b.weeks || [];
      for (const w of b.weeks) {
        w.days = w.days || [];
        for (const d of w.days) {
          d.id = d.id || uid();
          d.entries = d.entries || [];
          for (const e of d.entries) {
            e.id = e.id || uid();
            e.prog = e.prog || { m: "none", step: 0 };
          }
        }
      }
    }
    return state;
  }

  return {
    SEQ, DEFAULT_SETTINGS, PROG_LABEL,
    rpePct, roundTo, baseTm, parseReps, parseSets, parseRpe, targetReps,
    entryE1rm, analyze, currentE1rm, suggest, evaluate,
    progOptions, progressEntry, nextWeek, copyWeek, addDays,
    weeklyByFamily, plates, fmt, uid, normalize, dayKey,
  };
})();
if (typeof module !== "undefined") module.exports = Engine;

  // Wpis planu: T = top set na RPE z progresją +0,5/tydz., B = serie zejściowe −x% z top seta,

  function build(prog, w5, roundTo, rpePct) {

        const e = strip(x);
        if (x.f) e.value = w5[x.exId] > 0 ? Math.max(20, roundTo(w5[x.exId] * x.f, 2.5)) : (x.f < 1 ? 20 : DEF[x.exId] || 20);
        if (x.f && x.f < 1 && !(w5[x.exId] > 0)) e.value = x.exId === DL ? 40 : 20;
        return e;
      }) })));
    } else if (prog.kind === "531") {
      for (const ex of prog.lifts) if (w5[ex] > 0) out.bases[ex] = roundTo((w5[ex] / 0.811) * 0.9, 2.5); // TM = 90% szacowanego 1RM

          const entries = [];
          for (const ex of lifts) {
            W531[w].forEach((pct, i) => entries.push({ exId: ex, sets: "1", reps: String(R531[w][i]), type: "pct_max", value: pct, rpe: null, prog: { m: "none", step: 0 }, note: i === 2 && w < 3 ? "ostatnia seria: ile się da (min. " + R531[w][i] + ")" : null }));

          }

          return { name: `Dzień ${di + 1}` + (w === 3 ? " · lżej" : ""), entries };
        }));
      }
    } else {
      out.rpeBlock = true;
      for (const ex of prog.lifts) if (w5[ex] > 0) out.e1rm[ex] = Math.round((w5[ex] / rpePct(5, 8)) * 10) / 10;
      out.weeks.push(prog.plan.map(([name, ents]) => ({ name, entries: ents.map(strip) })));
    }
    return out;
  }
  return { library, PROGRAMS, build, VERSION, MUSCLES, OLD, LIB: BY_ID, make, muscleOf, secOf };
})();
