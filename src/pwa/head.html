<!doctype html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>
// Android bierze kolor dolnego paska z manifestu, więc wybieramy manifest w kolorze stylu (przed instalacją i przy każdym starcie)
(function () {
  var f = "manifest.webmanifest";
  try {
    var skin = (JSON.parse(localStorage.getItem("trening-look") || "{}").skin) || "calm";
    if (skin === "pomost") f = "manifest-pomost.webmanifest";
    else if (skin === "notes") f = "manifest-notes.webmanifest";
    else if (matchMedia("(prefers-color-scheme: dark)").matches) f = "manifest-dark.webmanifest";
  } catch (e) {}
  var l = document.createElement("link"); l.rel = "manifest"; l.href = f; document.head.appendChild(l);
})();
</script>
